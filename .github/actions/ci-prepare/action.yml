name: Prepare CI checkout
description: Blobless clone, Node.js, and the pull-request path scope.
outputs:
  mode:
    description: full, rust, or docs
    value: ${{ steps.scope.outputs.mode }}
runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Decide which gates this diff can skip
      id: scope
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: tools/ci-scope-decision.sh
