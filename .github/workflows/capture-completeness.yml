name: Isolated capture comparison

on:
  push:
    branches:
      - qa/capture-comparison-20261018

permissions:
  contents: read

concurrency:
  group: capture-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-fixture-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Pin installed browser for this run
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          version="$("$browser" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          test -n "$version"
          printf 'ORIGIN_TRACE_TEST_BROWSER=%s\nREB_REFERENCE_BROWSER_VERSION=%s\n' "$browser" "$version" >> "$GITHUB_ENV"
          printf 'Pinned installed browser version: %s\n' "$version"
      - name: Prove disappearing-session regression on exact prior backend
        shell: bash
        run: |
          baseline=5559e91eb0231846a65174c7ecc7b54d9a126ed6
          mkdir "$RUNNER_TEMP/capture-baseline"
          git archive "$baseline" | tar -x -C "$RUNNER_TEMP/capture-baseline"
          cargo build --locked --manifest-path "$RUNNER_TEMP/capture-baseline/apps/origin-trace-backend/Cargo.toml" --target-dir "$RUNNER_TEMP/capture-baseline-target"
          baseline_binary="$RUNNER_TEMP/capture-baseline-target/debug/origin-trace-backend"
          test -x "$baseline_binary"
          baseline_sha="$(sha256sum "$baseline_binary" | cut -d ' ' -f1)"
          printf 'BASELINE_BACKEND_SHA256=%s\n' "$baseline_sha" >> "$GITHUB_ENV"
          printf 'Baseline source: %s; binary SHA256: %s\n' "$baseline" "$baseline_sha"
          set +e
          ORIGIN_TRACE_BACKEND="$baseline_binary" REB_CLEANUP_REGRESSION_ONLY=1 node tools/check-traffic-browser-sessions.mjs . > "$RUNNER_TEMP/cleanup-baseline.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected prior backend regression did not reproduce'
            exit 1
          fi
          grep -F 'Confirmed redundant detach must not close whole transport' "$RUNNER_TEMP/cleanup-baseline.log"
          echo "Verified disappearing-session negative control on $baseline"
      - name: Build actual backend and transport serially
        shell: bash
        run: |
          # Baseline never writes this target directory. Sharing it can reuse the
          # baseline package fingerprint when checkout files have older mtimes.
          make -j1 origin-trace-backend debugger-transport
          candidate_binary="$GITHUB_WORKSPACE/apps/origin-trace-backend/target/debug/origin-trace-backend"
          test -x "$candidate_binary"
          candidate_sha="$(sha256sum "$candidate_binary" | cut -d ' ' -f1)"
          test "$candidate_sha" != "$BASELINE_BACKEND_SHA256"
          git diff --exit-code HEAD -- apps/origin-trace-backend
          printf 'ORIGIN_TRACE_BACKEND=%s\n' "$candidate_binary" >> "$GITHUB_ENV"
          printf 'Candidate source: %s; binary SHA256: %s\n' "$(git rev-parse HEAD)" "$candidate_sha"
      - name: Verify candidate cleanup races and fail-closed controls
        run: node tools/check-traffic-browser-sessions.mjs .
      - name: Run independent offline contract regressions
        run: make capture-completeness-check
      - name: Compare controlled localhost cohorts
        run: node tools/check-capture-completeness-browser.mjs . > "$RUNNER_TEMP/capture-comparison-source.json"
      - name: Validate allowlisted aggregate export
        id: sanitize
        if: ${{ !cancelled() }}
        run: node tools/sanitize-capture-completeness-report.mjs "$RUNNER_TEMP/capture-comparison-source.json" "$RUNNER_TEMP/capture-comparison-sanitized.json"
      - name: Upload sanitized aggregate only
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: capture-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/capture-comparison-sanitized.json
          if-no-files-found: error
          retention-days: 3
