name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test
        run: make check

      - name: Run end-to-end event path
        run: make e2e

      - name: Validate research UI server
        run: python3 -m py_compile apps/research-ui/server.py

      - name: Run sanitizers
        run: make sanitize

      - name: Build macOS application bundle
        if: matrix.os == 'macos-latest'
        run: make app-build

      - name: Verify macOS application signature
        if: matrix.os == 'macos-latest'
        run: codesign --verify --deep --strict "build/Origin Trace.app"

      - name: Upload macOS application preview
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: origin-trace-macos-${{ github.run_id }}
          path: build/Origin Trace.app
          if-no-files-found: error
          retention-days: 3
