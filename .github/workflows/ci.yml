name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install lightweight linters
        run: |
          # Hosted images include ShellCheck; avoid an unnecessary apt mirror dependency.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck --version
          python3 -m venv /tmp/reb-ci-tools
          /tmp/reb-ci-tools/bin/pip install --disable-pip-version-check \
            clang-format==18.1.8 ruff==0.12.8
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /tmp/reb-ci-tools/bin/actionlint
          echo "/tmp/reb-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Run source and repository checks
        run: make lint

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD

  graphql-sdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install explicit reference parser for authored fixtures
        run: npm install --prefix /tmp/reb-graphql --ignore-scripts --no-audit --no-fund graphql@16.11.0
      - name: Verify offline SDL with independent GraphQL parser
        run: REB_GRAPHQL_REFERENCE=/tmp/reb-graphql/node_modules/graphql node tools/check-graphql-sdl.mjs

  python-client-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install explicit Python export test dependencies
        run: |
          python3 -m venv /tmp/reb-python-export
          /tmp/reb-python-export/bin/python -m pip install --disable-pip-version-check \
            requests==2.34.2 httpx==0.28.1
          /tmp/reb-python-export/bin/python -m pip freeze

      - name: Test Requests and HTTPX against authored loopback fixtures
        run: |
          REB_PYTHON=/tmp/reb-python-export/bin/python \
            node tools/check-python-client-project.mjs --providers

  requests-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise Requests in installed Chrome
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          printf 'Browser executable: %s\n' "$REB_UI_CHROMIUM"
          node --version
          node tools/check-origin-trace-debugger.mjs --traffic-ui-browser

      - name: Upload rendered Requests QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: requests-ui-${{ github.run_id }}
          path: build/requests-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise API catalog in installed Chrome
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-api-observation-catalog-ui.mjs --browser

      - name: Upload rendered API catalog QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-catalog-ui-${{ github.run_id }}
          path: build/api-catalog-ui
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise Sources facts in installed Chrome
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          printf 'Browser executable: %s\n' "$REB_UI_CHROMIUM"
          node --version
          node tools/check-origin-trace-debugger.mjs --source-facts-ui-browser

      - name: Upload rendered Sources facts QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-facts-ui-${{ github.run_id }}
          path: build/source-facts-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise linked Evidence in installed Chrome
        env:
          REB_UI_REQUIRE_EVIDENCE_NAVIGATION: "1"
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          printf 'Browser executable: %s\n' "$REB_UI_CHROMIUM"
          node --version
          node tools/check-origin-trace-debugger.mjs --evidence-ui-browser

      - name: Upload rendered Evidence metadata QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-ui-${{ github.run_id }}
          path: build/evidence-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise Memory workflow in installed Chrome
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --memory-ui-browser

      - name: Upload rendered Memory QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memory-ui-${{ github.run_id }}
          path: build/memory-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise Float32 diagnostics with the actual backend
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked --manifest-path apps/origin-trace-backend/Cargo.toml
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --float32-ui-browser

      - name: Upload rendered Float32 QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: float32-ui-${{ github.run_id }}
          path: build/float32-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise original-to-disposable candidate bridge
        if: ${{ !cancelled() }}
        run: |
          # Reuse the actual backend already built for Float32 in this job.
          make origin-trace-backend debugger-transport deob-worker-build broker
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --candidate-bridge-ui-browser

      - name: Upload rendered candidate bridge QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-bridge-ui-${{ github.run_id }}
          path: build/candidate-bridge-ui-qa
          if-no-files-found: error
          retention-days: 3

      - name: Exercise supplied comparisons in Evidence
        env:
          REB_UI_REQUIRE_EVIDENCE_NAVIGATION: "1"
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --evidence-comparison-ui-browser

      - name: Upload rendered Evidence comparison QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-comparison-ui-${{ github.run_id }}
          path: build/comparison-ui-qa
          if-no-files-found: ignore
          retention-days: 3

  console-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise Console in installed Chrome
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --console-ui-browser

      - name: Upload rendered Console QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-ui-${{ github.run_id }}
          path: build/console-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise Collection in installed Chrome
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --collection-ui-browser

      - name: Upload rendered Collection QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collection-ui-${{ github.run_id }}
          path: build/collection-ui-qa
          if-no-files-found: ignore
          retention-days: 3

  canvas-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise Canvas previews in installed Chrome
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --canvas-ui-browser

      - name: Upload rendered Canvas QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canvas-ui-${{ github.run_id }}
          path: build/canvas-ui-qa
          if-no-files-found: error
          retention-days: 3

  investigation-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise connected investigation workflow
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --investigation-ui-browser

      - name: Upload rendered investigation QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: investigation-ui-${{ github.run_id }}
          path: build/investigation-ui-qa
          if-no-files-found: ignore
          retention-days: 3

  vm-workspace-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Render authored VM workspace states
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-vm-opcode-workspace-ui.mjs --browser

      - name: Upload rendered VM workspace QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-workspace-ui-${{ github.run_id }}
          path: build/vm-workspace-ui-qa
          if-no-files-found: ignore
          retention-days: 3

  sources-history-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Exercise Sources history after production cache eviction
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --sources-history-ui-browser

      - name: Upload rendered Sources history QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sources-history-ui-${{ github.run_id }}
          path: build/sources-history-ui-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise Sources tree native navigation and refresh
        if: ${{ !cancelled() }}
        run: |
          REB_UI_CHROMIUM="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export REB_UI_CHROMIUM
          test -n "$REB_UI_CHROMIUM"
          node tools/check-origin-trace-debugger.mjs --sources-tree-ui-browser

      - name: Upload rendered Sources tree QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sources-tree-ui-${{ github.run_id }}
          path: build/sources-tree-ui-qa
          if-no-files-found: ignore
          retention-days: 3

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test native tools and Rust components
        run: make check

      - name: Exercise generated Go client against authored loopback fixtures
        if: matrix.os == 'ubuntu-latest'
        run: |
          go version
          node tools/check-captured-client-project.mjs --go --mimic

      - name: Run end-to-end event path
        if: matrix.os == 'ubuntu-latest'
        run: make e2e

      - name: Verify multi-tab HTTP capture with installed Chrome
        if: matrix.os == 'ubuntu-latest'
        run: |
          ORIGIN_TRACE_TEST_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export ORIGIN_TRACE_TEST_BROWSER
          test -n "$ORIGIN_TRACE_TEST_BROWSER"
          make traffic-capture-check

      - name: Run sanitizers
        if: matrix.os == 'ubuntu-latest'
        run: make sanitize

      - name: Build macOS application bundle
        if: matrix.os == 'macos-latest'
        run: make app-build

      - name: Verify macOS application signature
        if: matrix.os == 'macos-latest'
        run: codesign --verify --deep --strict "build/Origin Trace.app"

      - name: Exercise relocated macOS package and live launcher
        if: matrix.os == 'macos-latest'
        run: |
          export ORIGIN_TRACE_TEST_BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$ORIGIN_TRACE_TEST_BROWSER"
          node tools/check-origin-trace-package.mjs

      - name: Upload native package diagnostics
        if: matrix.os == 'macos-latest' && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-package-${{ github.run_id }}
          path: build/package-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload named native Save-panel screenshots
        if: matrix.os == 'macos-latest' && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-client-project-panels-${{ github.run_id }}
          path: |
            build/package-qa/client-project-panels/*-panel.png
            build/package-qa/client-project-panels/phase-attachments.json
            build/package-qa/client-project-panels/result.json
            build/package-qa/client-project-panels/attachment-export-error.log
            build/package-qa/client-project-panels/native-smoke.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise native Analyst close and Quit lifecycle
        if: matrix.os == 'macos-latest'
        run: node tools/check-origin-trace-native-close.mjs

      - name: Upload native close diagnostics
        if: matrix.os == 'macos-latest' && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-close-${{ github.run_id }}
          path: build/native-close-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Archive macOS application preview
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request' && success()
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "build/Origin Trace.app"
          "build/Origin-Trace-macos-preview.zip"

      - name: Upload macOS application preview
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v7
        with:
          name: origin-trace-macos-${{ github.run_id }}
          path: build/Origin-Trace-macos-preview.zip
          if-no-files-found: error
          retention-days: 3
