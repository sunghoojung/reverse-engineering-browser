name: Continuous integration

# Pull-request speed, without dropping a gate that can see the diff:
# - Cancel a superseded push on the same pull request.
# - Blobless history. Checkout of this repo is already a few seconds; the
#   full history is only there so path scope and whitespace diffs work.
# - sccache plus the Cargo registry. Pushes to main save caches that later
#   pull requests can restore. Each saved compiler cache is capped at 500M
#   so a unique-per-commit key still fits GitHub's repository cache quota.
# - Parallel C++ compilation. Cargo stays one invocation at a time.
# - macOS `make check` and the app/XCTest gate use two runners. The required
#   check name remains `test (macos-latest)` and fails if either runner fails.
# - Documentation-only diffs skip native, Rust, and macOS gates. Rust-backend
#   diffs still run those tests and skip the macOS app archive and rendered UI.
#   Every other diff, plus push, schedule, and workflow_dispatch, runs the
#   full gate. The classifier fails closed.
# GitHub-hosted runner queue was a few seconds at the median in the October
# 2026 audit, so this file stays on ubuntu-latest and macos-latest.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Prepare repository
        uses: ./.github/actions/ci-prepare

      - name: Restore compiler cache
        id: cache
        uses: ./.github/actions/ci-cache
        with:
          role: lint-clippy

      - name: Install lightweight linters
        run: |
          # Hosted images include ShellCheck; avoid an unnecessary apt mirror dependency.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          shellcheck --version
          python3 -m venv /tmp/reb-ci-tools
          /tmp/reb-ci-tools/bin/pip install --disable-pip-version-check \
            clang-format==18.1.8 ruff==0.12.8
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /tmp/reb-ci-tools/bin/actionlint
          echo "/tmp/reb-ci-tools/bin" >> "$GITHUB_PATH"

      - name: Run source and repository checks
        run: make lint

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git show --check --oneline --no-renames HEAD

      - name: Report compiler cache
        if: always() && steps.cache.outcome == 'success'
        run: sccache --show-stats

  graphql-sdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install explicit reference parser for authored fixtures
        run: npm install --prefix /tmp/reb-graphql --ignore-scripts --no-audit --no-fund graphql@16.11.0
      - name: Verify offline SDL with independent GraphQL parser
        run: REB_GRAPHQL_REFERENCE=/tmp/reb-graphql/node_modules/graphql node tools/check-graphql-sdl.mjs

  python-client-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install explicit Python export test dependencies
        run: |
          python3 -m venv /tmp/reb-python-export
          /tmp/reb-python-export/bin/python -m pip install --disable-pip-version-check \
            requests==2.34.2 httpx==0.28.1
          /tmp/reb-python-export/bin/python -m pip freeze

      - name: Test Requests and HTTPX against authored loopback fixtures
        run: |
          REB_PYTHON=/tmp/reb-python-export/bin/python \
            node tools/check-python-client-project.mjs --providers

  ubuntu-test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Prepare repository
        id: prep
        uses: ./.github/actions/ci-prepare

      - name: Record narrowed gate
        if: success() && steps.prep.outputs.mode != 'full'
        env:
          CI_SCOPE: ${{ steps.prep.outputs.mode }}
        run: |
          echo "CI scope is ${CI_SCOPE}."
          echo "Push to main, the daily schedule, and workflow_dispatch run the full gate."

      - name: Restore compiler cache
        id: cache
        if: success() && steps.prep.outputs.mode != 'docs'
        uses: ./.github/actions/ci-cache
        with:
          role: ubuntu-debug

      - name: Build and test native tools and Rust components
        if: success() && steps.prep.outputs.mode != 'docs'
        run: ./tools/ci-run-make.sh check

      - name: Release-compile Rust packages
        if: success() && steps.prep.outputs.mode == 'rust'
        run: |
          cargo build --locked --release --manifest-path apps/origin-trace-backend/Cargo.toml
          cargo build --locked --release --manifest-path apps/deobfuscator-worker/Cargo.toml

      - name: Exercise generated Go client against authored loopback fixtures
        if: success() && steps.prep.outputs.mode != 'docs'
        run: |
          go version
          node tools/check-captured-client-project.mjs --go --mimic

      - name: Run end-to-end event path
        if: success() && steps.prep.outputs.mode != 'docs'
        run: ./tools/ci-run-make.sh e2e

      - name: Run sanitizers
        if: success() && steps.prep.outputs.mode == 'full'
        run: ./tools/ci-run-make.sh sanitize

      - name: Report compiler cache
        if: always() && steps.cache.outcome == 'success'
        run: sccache --show-stats

  macos-check:
    name: macos-check
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Prepare repository
        id: prep
        uses: ./.github/actions/ci-prepare

      - name: Record narrowed gate
        if: success() && steps.prep.outputs.mode == 'docs'
        run: echo "Documentation-only diff; macOS make check runs on main and the daily schedule."

      - name: Restore compiler cache
        id: cache
        if: success() && steps.prep.outputs.mode != 'docs'
        uses: ./.github/actions/ci-cache
        with:
          role: macos-debug

      - name: Build and test native tools and Rust components
        if: success() && steps.prep.outputs.mode != 'docs'
        run: ./tools/ci-run-make.sh check

      - name: Report compiler cache
        if: always() && steps.cache.outcome == 'success'
        run: sccache --show-stats

  macos-package:
    name: macos-package
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Prepare repository
        id: prep
        uses: ./.github/actions/ci-prepare

      - name: Record narrowed gate
        if: success() && steps.prep.outputs.mode != 'full'
        env:
          CI_SCOPE: ${{ steps.prep.outputs.mode }}
        run: |
          echo "CI scope is ${CI_SCOPE}; skipping the macOS app archive and rendered UI."
          echo "Push to main, the daily schedule, and workflow_dispatch run that gate."

      - name: Restore compiler cache
        id: cache
        if: success() && steps.prep.outputs.mode == 'full'
        uses: ./.github/actions/ci-cache
        with:
          role: macos-release

      - name: Build macOS application bundle
        if: success() && steps.prep.outputs.mode == 'full'
        run: ./tools/ci-run-make.sh app-build

      - name: Verify macOS application signature
        if: success() && steps.prep.outputs.mode == 'full'
        run: codesign --verify --deep --strict "build/Origin Trace.app"

      - name: Exercise relocated macOS package and live launcher
        if: success() && steps.prep.outputs.mode == 'full'
        run: |
          export ORIGIN_TRACE_TEST_BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$ORIGIN_TRACE_TEST_BROWSER"
          node tools/check-origin-trace-package.mjs

      - name: Upload native package diagnostics
        if: always() && steps.prep.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: native-package-${{ github.run_id }}
          path: build/package-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload named native Save-panel screenshots
        if: always() && steps.prep.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: native-client-project-panels-${{ github.run_id }}
          path: |
            build/package-qa/client-project-panels/*-panel.png
            build/package-qa/client-project-panels/phase-attachments.json
            build/package-qa/client-project-panels/result.json
            build/package-qa/client-project-panels/attachment-export-error.log
            build/package-qa/client-project-panels/native-smoke.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Exercise native Analyst close and Quit lifecycle
        if: success() && steps.prep.outputs.mode == 'full'
        run: node tools/check-origin-trace-native-close.mjs

      - name: Exercise rendered packaged UI with hosted XCTest
        if: success() && steps.prep.outputs.mode == 'full'
        run: |
          make e2e native-wasm-golden-check vm-observed-evidence
          node tools/check-origin-trace-rendered-ui.mjs

      - name: Upload rendered UI screenshots
        if: always() && steps.prep.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: rendered-ui-${{ github.run_id }}
          path: |
            build/rendered-ui-qa/screenshots
            build/rendered-ui-qa/result.json
            build/rendered-ui-qa/xcodebuild.log
            build/rendered-ui-qa/backend.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload native close diagnostics
        if: always() && steps.prep.outputs.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: native-close-${{ github.run_id }}
          path: build/native-close-qa
          if-no-files-found: ignore
          retention-days: 3

      - name: Archive macOS application preview
        if: success() && steps.prep.outputs.mode == 'full' && github.event_name == 'pull_request'
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "build/Origin Trace.app"
          "build/Origin-Trace-macos-preview.zip"

      - name: Upload macOS application preview
        if: success() && steps.prep.outputs.mode == 'full' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: origin-trace-macos-${{ github.run_id }}
          path: build/Origin-Trace-macos-preview.zip
          if-no-files-found: error
          retention-days: 3

      - name: Report compiler cache
        if: always() && steps.cache.outcome == 'success'
        run: sccache --show-stats

  macos-gate:
    name: test (macos-latest)
    needs: [macos-check, macos-package]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both macOS gates
        env:
          MACOS_CHECK: ${{ needs.macos-check.result }}
          MACOS_PACKAGE: ${{ needs.macos-package.result }}
        run: |
          set -eu
          echo "macos-check ${MACOS_CHECK}"
          echo "macos-package ${MACOS_PACKAGE}"
          test "${MACOS_CHECK}" = success
          test "${MACOS_PACKAGE}" = success

  public-quickjs-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Prepare repository
        id: prep
        uses: ./.github/actions/ci-prepare

      - name: Restore compiler cache
        id: cache
        if: success() && steps.prep.outputs.mode != 'docs'
        uses: ./.github/actions/ci-cache
        with:
          role: quickjs

      - name: Install pinned public interpreter without lifecycle scripts
        if: success() && steps.prep.outputs.mode != 'docs'
        run: npm ci --prefix tools/quickjs-native-fixture --ignore-scripts --no-audit --no-fund

      - name: Verify the pinned public interpreter and authored ABI records (not native capture)
        if: success() && steps.prep.outputs.mode != 'docs'
        run: ./tools/ci-run-make.sh quickjs-binding-check

      - name: Report compiler cache
        if: always() && steps.cache.outcome == 'success'
        run: sccache --show-stats
