name: Native V8 runtime
on:
  workflow_dispatch:
  # Runs on main seed the compiler-object cache that pull requests restore.
  push:
    branches: [main]
    paths:
      - 'browser/config/v8.rev'
      - 'browser/integration/brave/patches/v8/**'
      - 'tools/check-native-v8-runtime.py'
      - 'tools/install-native-llvm.py'
      - 'tools/native-llvm23-release.json'
      - '.github/workflows/native-v8-runtime.yml'
      - 'tools/quickjs-native-fixture/**'
  pull_request:
    paths:
      - 'browser/config/v8.rev'
      - 'browser/integration/brave/patches/v8/**'
      - 'tools/check-native-v8-runtime.py'
      - 'tools/install-native-llvm.py'
      - 'tools/native-llvm23-release.json'
      - '.github/workflows/native-v8-runtime.yml'
      - 'tools/quickjs-native-fixture/**'
permissions:
  contents: read
concurrency:
  group: native-v8-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  standalone-runtime:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install source-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-15 ninja-build pkg-config libglib2.0-dev ccache zstd python3-httplib2
      - name: Extract the digest-pinned official LLVM23 release privately and check required compiler flags
        run: |
          python3 tools/install-native-llvm.py --self-test
          python3 tools/install-native-llvm.py \
            --prefix "$RUNNER_TEMP/reb-llvm23" --receipt build/native-llvm23.json
          python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["bin"])' build/native-llvm23.json >> "$GITHUB_PATH"
      - name: Restore bounded compiler objects (never source or credentials)
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reb-native-ccache
          key: native-v8-ubuntu26-clang23-${{ hashFiles('browser/config/v8.rev', 'tools/native-llvm23-release.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-v8-ubuntu26-clang23-${{ hashFiles('browser/config/v8.rev', 'tools/native-llvm23-release.json') }}-
      - name: Validate standalone adaptation
        run: python3 tools/check-native-v8-runtime.py --self-test
      - name: Compile pinned native runtime and execute real C++ tests
        run: >-
          python3 tools/check-native-v8-runtime.py
          --work-dir "$RUNNER_TEMP/reb-native-v8"
          --receipt build/native-v8-runtime.json
          --jobs 2
          --ccache-dir "$RUNNER_TEMP/reb-native-ccache"
      - name: Preserve successful compiler objects even after a later failure
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reb-native-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Preserve build and test receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-v8-runtime-${{ github.run_id }}
          path: |
            build/native-v8-runtime.json
            build/native-llvm23.json
          if-no-files-found: warn
          retention-days: 7
