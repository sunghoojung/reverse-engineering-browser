[package]
name = "origin-trace-backend"
version = "0.5.2"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
tempfile = "3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonschema = { version = "0.33", default-features = false }
unicode-casefold = "0.2"
wasmparser = "0.240"
# Pure-Rust Wasm interpreter with fuel metering and no JIT, for run_wasm_function.
# portable-dispatch is a loop: the default tail-call dispatch relies on LLVM
# sibling-call optimization, and without it a long captured loop overflows the
# native stack and aborts the backend.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "stable", "portable-dispatch", "validate", "simd", "deterministic"] }
# Names the error type of wasmi's ResourceLimiter trait, which wasmi does not re-export.
wasmi_core = { version = "=2.0.0", default-features = false }
oxc_allocator = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
stacker = "=0.1.25"

[build-dependencies]
# Compiles the vendored Triskel graph layout engine; see vendor/README.md.
cc = "=1.10.0"

[dev-dependencies]
wat = "=1.240.0"

# The interpreter runs captured functions under fuel and a wall-clock deadline.
# Unoptimized, it spends most of a deadline on dispatch overhead, so the debug
# backend and its tests keep it optimized.
[profile.dev.package.wasmi]
opt-level = 3
