[package]
name = "origin-trace-backend"
version = "0.3.2"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
url = "2.5"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
tempfile = "3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonschema = { version = "0.33", default-features = false }
unicode-casefold = "0.2"
wasmparser = "0.240"
oxc_allocator = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_semantic = "=0.155.0"
oxc_span = "=0.155.0"
oxc_syntax = "=0.155.0"
stacker = "=0.1.25"

[dev-dependencies]
wat = "=1.240.0"
