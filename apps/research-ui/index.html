<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reverse Engineering Browser</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: #090b10;
        color: #e7eaf0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0%, #172039 0, transparent 32rem), #090b10; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border-bottom: 1px solid #252a35; background: rgba(9, 11, 16, .88); position: sticky; top: 0; backdrop-filter: blur(18px); }
      h1 { margin: 0; font-size: 1rem; letter-spacing: .02em; }
      .status { display: flex; align-items: center; gap: .5rem; color: #9ba5b6; font-size: .8rem; }
      .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #43d17d; box-shadow: 0 0 1rem #43d17d88; }
      main { display: grid; grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); min-height: calc(100vh - 3.6rem); }
      aside { border-right: 1px solid #252a35; padding: 1.25rem; }
      .label { display: block; color: #788397; font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: .6rem; }
      input, select { width: 100%; border: 1px solid #303745; border-radius: .55rem; background: #11151d; color: inherit; padding: .65rem .75rem; margin-bottom: .8rem; }
      .metric { background: #11151d; border: 1px solid #252a35; border-radius: .7rem; padding: .8rem; margin-top: .7rem; }
      .metric strong { display: block; font-size: 1.45rem; margin-top: .15rem; }
      section { padding: 1.25rem; overflow: hidden; }
      .empty { color: #8792a5; padding: 3rem 1rem; text-align: center; border: 1px dashed #303745; border-radius: .8rem; }
      .event { display: grid; grid-template-columns: 7rem 8rem minmax(9rem, 1fr) minmax(12rem, 2fr); gap: .75rem; align-items: center; border-bottom: 1px solid #222733; padding: .78rem .55rem; font: .78rem ui-monospace, SFMono-Regular, Menlo, monospace; }
      .event:hover { background: #121722; }
      .seq { color: #738097; }
      .category { color: #8db6ff; }
      .type { color: #c7a6ff; }
      .payload { color: #dce3ef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .85rem; }
      h2 { font-size: 1rem; margin: 0; }
      #updated { color: #69758a; font-size: .72rem; }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #252a35; } .event { grid-template-columns: 4rem 6rem 1fr; } .payload { grid-column: 1 / -1; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Reverse Engineering Browser</h1>
      <div class="status" role="status"><span class="dot" aria-hidden="true"></span><span>Local evidence broker</span></div>
    </header>
    <main>
      <aside>
        <label class="label" for="search">Find evidence</label>
        <input id="search" type="search" placeholder="Request, API, value..." />
        <label class="label" for="category">Event category</label>
        <select id="category">
          <option value="">All categories</option>
          <option>canvas</option><option>navigator</option><option>wasm</option><option>network</option>
          <option>webgl</option><option>web_audio</option><option>storage</option>
        </select>
        <div class="metric"><span class="label">Visible events</span><strong id="count">0</strong></div>
        <div class="metric"><span class="label">Sequence gaps</span><strong id="gaps">0</strong></div>
      </aside>
      <section>
        <div class="title-row"><h2>Investigation timeline</h2><span id="updated">Waiting for evidence</span></div>
        <div id="events" class="empty">No native probe events captured yet.</div>
      </section>
    </main>
    <script>
      const state = { events: [] };
      const elements = {
        search: document.querySelector('#search'), category: document.querySelector('#category'),
        events: document.querySelector('#events'), count: document.querySelector('#count'),
        gaps: document.querySelector('#gaps'), updated: document.querySelector('#updated')
      };
      function decodePayload(event) {
        if (event.payload_encoding !== 'hex') return event.payload || '';
        try { return new TextDecoder().decode(Uint8Array.from(event.payload.match(/.{2}/g) || [], byte => parseInt(byte, 16))); }
        catch { return event.payload; }
      }
      function render() {
        const needle = elements.search.value.toLowerCase();
        const category = elements.category.value;
        const events = state.events.filter(event => (!category || event.category === category) &&
          (!needle || JSON.stringify(event).toLowerCase().includes(needle) || decodePayload(event).toLowerCase().includes(needle)));
        elements.count.textContent = events.length;
        let gaps = 0;
        const highWaterMarks = new Map();
        for (const event of state.events) {
          const previous = highWaterMarks.get(event.session_id);
          if (previous !== undefined && event.sequence_number > previous &&
              event.sequence_number - previous > 1) {
            gaps += event.sequence_number - previous - 1;
          }
          highWaterMarks.set(event.session_id,
            Math.max(previous ?? event.sequence_number, event.sequence_number));
        }
        elements.gaps.textContent = gaps;
        if (!events.length) { elements.events.className = 'empty'; elements.events.textContent = 'No matching native probe events.'; return; }
        elements.events.className = '';
        elements.events.replaceChildren(...events.map(event => {
          const row = document.createElement('div'); row.className = 'event';
          const values = [
            ['seq', `#${event.sequence_number}`], ['category', event.category],
            ['type', event.type], ['payload', decodePayload(event)]
          ];
          for (const [className, value] of values) {
            const cell = document.createElement('span'); cell.className = className;
            cell.textContent = String(value ?? '');
            if (className === 'payload') cell.title = cell.textContent;
            row.append(cell);
          }
          return row;
        }));
      }
      async function refresh() {
        try { const response = await fetch('/api/events?limit=500', { cache: 'no-store' }); if (!response.ok) throw new Error(`Broker returned ${response.status}`); const body = await response.json(); state.events = body.events || []; elements.updated.textContent = `Updated ${new Date().toLocaleTimeString()}`; render(); }
        catch { elements.updated.textContent = 'Broker unavailable'; }
      }
      elements.search.addEventListener('input', render); elements.category.addEventListener('change', render);
      refresh(); setInterval(refresh, 2000);
    </script>
  </body>
</html>
