  <path d="M1210 430H905V396H882" class="edge"/>
  <text x="1002" y="421" class="edge-label">renderer events</text>
  <path d="M882 396H965V226H1030" class="edge"/>
  <text x="970" y="217" class="edge-label">event batches</text>
  <path d="M1745 430H1810V335H1000V250H1030" class="edge"/>
  <text x="1460" y="326" class="edge-label">service-process events</text>

  <!-- Runtime to harness -->
  <path d="M1071 267V710" class="duplex"/>
  <text x="1083" y="570" class="edge-label">events / commands</text>
  <path d="M1112 250H1320V280H1800V330H1720V345" class="control"/>
  <text x="1490" y="271" class="edge-label">Mojo control</text>
  <path d="M1112 751H1160" class="edge"/>
  <text x="1136" y="742" text-anchor="middle" class="edge-label">socket</text>
  <path d="M1242 751H1280" class="edge"/>
  <text x="1261" y="742" text-anchor="middle" class="edge-label">events</text>
  <path d="M1590 759H1528" class="control"/>
  <path d="M1460 759H1398" class="control"/>
  <path d="M1330 759H1290V650H1071" class="control"/>

  <!-- Client paths -->
  <path d="M174 705H350" class="edge"/>
  <text x="220" y="696" class="edge-label">tools and controls</text>
  <path d="M525 915V925H1730V759H1658" class="edge"/>
  <text x="755" y="915" class="edge-label">MCP · UI · SDK requests</text>

  <!-- Results back to clients -->
  <path d="M1242 771H1260V880H720V850H700" class="edge"/>
  <text x="805" y="871" class="edge-label">events, evidence, and command results</text>
</svg>
