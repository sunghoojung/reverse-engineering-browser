# Repository-maintained manifest for the pinned MIT-licensed Oxc source.
[package]
name = "oxc_semantic"
version = "0.155.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
publish = false
repository = "https://github.com/oxc-project/oxc"
description = "Pinned Oxc semantic analysis with linear JavaScript reference resolution"
[features]
reference-audit = []
cfg = ["dep:oxc_cfg"]
default = []
jsdoc = ["dep:oxc_jsdoc"]
linter = ["jsdoc"]
serialize = ["oxc_span/serialize", "oxc_syntax/serialize"]
[dependencies.itertools]
version = "0.15.0"
[dependencies.memchr]
version = "2.8.2"
[dependencies.oxc_allocator]
version = "=0.155.0"
features = ["bitset"]
[dependencies.oxc_ast]
version = "=0.155.0"
[dependencies.oxc_ast_visit]
version = "=0.155.0"
[dependencies.oxc_cfg]
version = "=0.155.0"
optional = true
[dependencies.oxc_data_structures]
version = "=0.155.0"
[dependencies.oxc_diagnostics]
version = "=0.155.0"
[dependencies.oxc_ecmascript]
version = "=0.155.0"
[dependencies.oxc_index]
version = "5.0.0"
features = ["nonmax", "serde"]
[dependencies.oxc_jsdoc]
version = "=0.155.0"
optional = true
[dependencies.oxc_span]
version = "=0.155.0"
[dependencies.oxc_str]
version = "=0.155.0"
[dependencies.oxc_syntax]
version = "=0.155.0"
features = ["to_js_string"]
[dependencies.rustc-hash]
version = "2"
[dependencies.self_cell]
version = "1.2.2"
[dependencies.smallvec]
version = "1.15.2"
features = ["union", "serde"]
